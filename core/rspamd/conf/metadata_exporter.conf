custom_select {
  MAILU_GREYLIST = <<EOD
return function(task)
  return task:has_symbol('GREYLIST')
end
EOD;
  MAILU_GREYLIST_CLEAR = <<EOD
return function(task)
  local message_id = task:get_message_id()
  local action = task:get_metric_action()
  return message_id ~= nil and
      (action == 'no action' or action == 'accept' or action == 'add header' or action == 'rewrite subject')
end
EOD;
}
rules {
  MAILU_QUARANTINE {
    backend = "http";
    url = "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/quarantine";
    user = "quarantine";
    password = "{{ QUARANTINE_KEY }}";
    selector = "is_reject";
    formatter = "multipart";
    defer = true;
    timeout = 15s;
  }
  MAILU_GREYLIST {
    backend = "http";
    url = "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/greylist";
    user = "quarantine";
    password = "{{ QUARANTINE_KEY }}";
    selector = "MAILU_GREYLIST";
    formatter = "multipart";
    defer = false;
    timeout = 5s;
  }
  MAILU_GREYLIST_CLEAR {
    backend = "http";
    url = "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/greylist";
    user = "quarantine";
    password = "{{ QUARANTINE_KEY }}";
    selector = "MAILU_GREYLIST_CLEAR";
    formatter = "json";
    defer = false;
    timeout = 5s;
  }
}
.include(try=true,priority=1,duplicate=merge) "/overrides/metadata_exporter.conf"
