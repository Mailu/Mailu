; Snappymail Webmail configuration file

[webmail]
attachment_size_limit = {{ MAX_FILESIZE }}

[security]
allow_admin_panel = Off
openpgp = On
insecure_cryptkey = On

[labs]
allow_gravatar = Off
image_exif_auto_rotate = On
try_to_detect_hidden_images = On
custom_login_link = "/snappymail/sso.php"
custom_logout_link = "/sso/logout"

[contacts]
enable = On
allow_sync = On

[defaults]
contacts_autosave = On
autologout = {{ (((PERMANENT_SESSION_LIFETIME | default(10800)) | int)/60) | int }}

[cache]
enable = On
fast_cache_driver = "APCU"

[imap]
use_move = On

[plugins]
enable = On
enabled_list = "mailu-identities,mailu-carddav"

[mailu]
{% if ADMIN %}
account_settings_url = "../../admin/user/settings"
{% endif %}
{% if DAV_ENABLED %}
[custom]
mailu_carddav_url = "{{ DAV_PUBLIC_URL }}"
mailu_carddav_internal_url = "{{ DAV_INTERNAL_URL }}"
{% endif %}
