{%- extends "base_sso.html" %}

{%- block title %}{% trans %}Add a passkey{% endtrans %}{%- endblock %}

{% block content %}
<p class="text-body-secondary">{% trans %}Add a passkey to{% endtrans %} <strong>{{ user.email }}</strong></p>
<form id="enrollment-form" class="form">
  {{ form.hidden_tag() }}
  <div class="mb-3">
    <label class="form-label" for="passkey-name">{% trans %}Passkey name{% endtrans %}</label>
    <input class="form-control" id="passkey-name" name="name" maxlength="255" value="{% trans %}New passkey{% endtrans %}" required>
  </div>
  <button class="btn btn-primary" id="enroll" type="submit">{% trans %}Add passkey{% endtrans %}</button>
</form>
<div id="enrollment-status" class="alert d-none mt-3" role="status" aria-live="polite"></div>
<script>
(() => {
  const form = document.getElementById('enrollment-form');
  const button = document.getElementById('enroll');
  const status = document.getElementById('enrollment-status');
  const csrf = form.querySelector('[name="csrf_token"]').value;
  const optionsUrl = {{ url_for('sso.passkey_enrollment_options', token=request.view_args.token) | tojson }};
  const registerUrl = {{ url_for('sso.passkey_enrollment_register', token=request.view_args.token) | tojson }};
  const decode = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const encode = value => btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const json = async (response, action) => {
    let data;
    try { data = await response.json(); }
    catch (_) { throw new Error(`${action} failed (HTTP ${response.status}).`); }
    if (!response.ok) throw new Error(data.error || `${action} failed (HTTP ${response.status}).`);
    return data;
  };
  form.addEventListener('submit', async event => {
    event.preventDefault();
    status.className = 'alert d-none mt-3';
    button.disabled = true;
    try {
      if (!window.PublicKeyCredential || !navigator.credentials?.create) throw new Error({{ _('This browser does not support passkey registration.') | tojson }});
      const start = await fetch(optionsUrl, {method: 'POST', headers: {'X-CSRFToken': csrf}});
      const options = await json(start, 'Could not start registration');
      options.challenge = decode(options.challenge);
      options.user.id = decode(options.user.id);
      if (options.excludeCredentials) options.excludeCredentials = options.excludeCredentials.map(item => ({...item, id: decode(item.id)}));
      const credential = await navigator.credentials.create({publicKey: options});
      const finish = await fetch(registerUrl, {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
        body: JSON.stringify({
          id: credential.id, rawId: encode(credential.rawId), type: credential.type,
          name: document.getElementById('passkey-name').value.trim(),
          response: {
            attestationObject: encode(credential.response.attestationObject),
            clientDataJSON: encode(credential.response.clientDataJSON),
            transports: credential.response.getTransports ? credential.response.getTransports() : []
          }
        })
      });
      const result = await json(finish, 'Passkey registration failed');
      if (result.redirect) {
        window.location.assign(result.redirect);
        return;
      }
      throw new Error({{ _('Passkey registration succeeded but no login redirect was returned.') | tojson }});
    } catch (error) {
      status.textContent = error.name === 'NotAllowedError'
        ? {{ _('Passkey setup was cancelled or timed out. Start again and complete the prompt on your device.') | tojson }}
        : (error.message || {{ _('Passkey registration failed.') | tojson }});
      status.className = 'alert alert-danger mt-3';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
{% endblock %}
