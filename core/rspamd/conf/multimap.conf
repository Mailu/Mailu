IS_LOCAL_DOMAIN_H {
  type = "selector"
  selector = "from('mime'):domain";
  map = "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/local_domains";
}
IS_LOCAL_DOMAIN_E {
  type = "selector"
  selector = "from('smtp'):domain";
  map = "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/local_domains";
}
IS_LOCALLY_GENERATED {
  type = "ip"
  map = ["/etc/rspamd/local.d/local_subnet.map"];
}
FORBIDDEN_FILE_EXTENSION {
    type = "filename";
    filter = "extension";
    map = [
    "/etc/rspamd/local.d/forbidden_file_extension.map",
    ];
    prefilter = true;
    action = "reject";
    symbol = "FORBIDDEN_FILE_EXTENSION";
    description = "List of forbidden file extensions";
    message = "Forbidden attachment extension";
}
local_fspam {
    type = "url";
    filter = "full";
    map = [
        "/overrides/url-regexp.map",
        "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/spam-map/url-regexps",
    ];
    regexp = true;
    description = "URLs matching a locally configured regular expression";
    group = "local_bl";
    action = "reject";
    symbol = "LOCAL_BL_URL_REGEXP";
    prefilter = true;
}
local_bl_domain {
    type = "from";
    filter = "email:domain";
    map = [
        "/overrides/blacklist.inc",
        "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/spam-map/blacklist-domains",
    ];
    score = 14;
    description = "Sender domain is on the local blacklist";
    group = "local_bl";
    action = "reject";
    symbol = "LOCAL_BL_FROM";
}
local_bl_domain_mime {
    type = "header";
    header = "from";
    filter = "email:domain";
    map = [
        "/overrides/blacklist.inc",
        "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/spam-map/blacklist-domains",
    ];
    score = 14;
    description = "Header From domain is on the local blacklist";
    group = "local_bl";
    action = "reject";
    symbol = "LOCAL_BL_FROM_H";
}
local_wl_from {
    type = "from";
    filter = "email:domain";
    map = [
        "/overrides/whitelist.inc",
        "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/spam-map/whitelist-domains",
    ];
    score = -15;
    description = "Sender domain is on the local whitelist";
    group = "local_wl";
    action = "accept";
    symbol = "LOCAL_WL_FROM";
}
local_wl_from_mime {
    type = "header";
    header = "from";
    filter = "email:domain";
    map = [
        "/overrides/whitelist.inc",
        "http://{{ ADMIN_ADDRESS }}:8080/internal/rspamd/spam-map/whitelist-domains",
    ];
    score = -15;
    description = "Header From domain is on the local whitelist";
    group = "local_wl";
    action = "accept";
    symbol = "LOCAL_WL_FROM_H";
}
.include(try=true,priority=1,duplicate=merge) "/overrides/multimap.conf"
