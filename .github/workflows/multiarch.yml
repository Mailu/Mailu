name: start-linux-multiarch
on:
  push:
    branches:
      - testing
      - staging
      - '2024.06'
      - master
      - test-*

concurrency: ci-multiarch-${{ github.ref }}

permissions: {}

# REQUIRED global variables
# DOCKER_ORG, docker org used for pushing images.
env:
  DOCKER_ORG: ghcr.io/mailu

jobs:
# This job calculates all global job variables that are required by all the subsequent jobs.
# All subsequent jobs will retrieve and use these variables. This way the variables only have to be derived once.
  derive-variables:
    name: derive variables
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
        MAILU_VERSION: ${{ env.MAILU_VERSION }}
        PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}
        DOCKER_ORG: ${{ env.DOCKER_ORG_DERIVED }}
        BRANCH: ${{ env.BRANCH }}
        DEPLOY: ${{ env.DEPLOY }}
        RELEASE: ${{ env.RELEASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 is required to also retrieve all tags.
          fetch-depth: 0
          persist-credentials: false
      - name: Extract branch name
        shell: bash
        run: |
          printf 'BRANCH=%s\n' "${GITHUB_REF#refs/heads/}" >> "$GITHUB_ENV"
        #For branch TESTING, we set the image tag to pr-xxxx
      - name: Derive MAILU_VERSION and PINNED_MAILU_VERSION and DEPLOY/RELEASE for branch testing
        if: env.BRANCH == 'testing'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            printf 'MAILU_VERSION=pr-%s\n' "${COMMIT_MESSAGE//[!0-9]/}"
            printf 'PINNED_MAILU_VERSION=pr-%s\n' "${COMMIT_MESSAGE//[!0-9]/}"
            printf 'DOCKER_ORG_DERIVED=%s\n' "$DOCKER_ORG"
            printf 'DEPLOY=true\n'
            printf 'RELEASE=false\n'
          } >> "$GITHUB_ENV"
      - name: Derive MAILU_VERSION and DEPLOY/RELEASE for other branches than testing
        if: env.BRANCH != 'testing'
        shell: bash
        run: |
          {
            printf 'MAILU_VERSION=%s\n' "$BRANCH"
            printf 'DOCKER_ORG_DERIVED=%s\n' "$DOCKER_ORG"
            printf 'DEPLOY=true\n'
            printf 'RELEASE=false\n'
          } >> "$GITHUB_ENV"
      - name: Derive PINNED_MAILU_VERSION and DEPLOY/RELEASE for normal release x.y
        if: env.BRANCH != 'testing' && env.BRANCH != 'staging' && env.BRANCH != 'master' && !(contains(env.BRANCH, 'test-'))
        shell: bash
        run: |
          version=$(git tag --sort=version:refname --list "$MAILU_VERSION.*" | tail -1)
          root_version=${version%.*}
          patch_version=${version##*.}
          if [[ -z "$patch_version" ]]; then
            pinned_version="$MAILU_VERSION.0"
          else
            pinned_version="$root_version.$((patch_version + 1))"
          fi
          {
            printf 'PINNED_MAILU_VERSION=%s\n' "$pinned_version"
            printf 'DEPLOY=true\n'
            printf 'RELEASE=true\n'
          } >> "$GITHUB_ENV"
      - name: Derive PINNED_MAILU_VERSION and DEPLOY/RELEASE for staging
        id: deploy
        if: env.BRANCH == 'staging'
        shell: bash
        run: |
          {
            printf 'PINNED_MAILU_VERSION=staging\n'
            printf 'DEPLOY=false\n'
            printf 'RELEASE=false\n'
          } >> "$GITHUB_ENV"
      - name: Derive PINNED_MAILU_VERSION for master
        if: env.BRANCH == 'master'
        shell: bash
        run: |
          {
            printf 'PINNED_MAILU_VERSION=%s\n' "$GITHUB_SHA"
            printf 'DEPLOY=true\n'
            printf 'RELEASE=false\n'
          } >> "$GITHUB_ENV"
      - name: Derive for branch test-*
        if: contains(env.BRANCH, 'test-')
        run: |
          {
            printf 'MAILU_VERSION=%s\n' "$BRANCH"
            printf 'PINNED_MAILU_VERSION=%s\n' "$BRANCH"
            printf 'DOCKER_ORG_DERIVED=%s\n' "$DOCKER_ORG"
            printf 'DEPLOY=true\n'
            printf 'RELEASE=false\n'
          } >> "$GITHUB_ENV"

  build-test-deploy:
    needs:
      - derive-variables
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build_test_deploy.yml
    with:
      architecture: 'linux/amd64,linux/arm64/v8,linux/arm/v7'
      mailu_version: ${{needs.derive-variables.outputs.MAILU_VERSION}}
      pinned_mailu_version: ${{needs.derive-variables.outputs.PINNED_MAILU_VERSION}}
      docker_org: ${{needs.derive-variables.outputs.DOCKER_ORG}}
      branch: ${{needs.derive-variables.outputs.BRANCH}}
      deploy: ${{needs.derive-variables.outputs.DEPLOY}}
      release: ${{needs.derive-variables.outputs.RELEASE}}
    secrets:
      Docker_Login: ${{ secrets.Docker_Login }}
      Docker_Password: ${{ secrets.Docker_Password }}
      Docker_Login2: ${{ secrets.Docker_Login2 }}
      Docker_Password2: ${{ secrets.Docker_Password2 }}

 # This job is watched by bors. It only complets if building,testing and deploy worked.
  ci-success:
    name: CI-Done
    #Returns true when none of the **previous** steps have failed or have been canceled.
    if: success()
    needs:
      - build-test-deploy
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: CI/CD succeeded.
        run: exit 0

