# Must be the first non-comment line, and must not be newer than the dovecot
# being run. 2.4.0 is deliberate: it is the oldest 2.4 and therefore accepted
# by every 2.4.x.
{% set oauth2_scheme = 'http' if TLS_FLAVOR == 'notls' else 'https' %}
{% set oauth2_issuers = oauth2_scheme ~ '://' ~ (HOSTNAMES.split(',') | map('trim') | join(' ' ~ oauth2_scheme ~ '://')) %}
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

###############
# General
###############
log_path = /dev/stderr
protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  submission = yes
  sieve = yes
}
postmaster_address = {{ POSTMASTER }}@{{ DOMAIN }}
hostname = {{ HOSTNAMES.split(",")[0] }}
mail_utf8_extensions = yes
{%- if PROXY_PROTOCOL_25 %}
submission_host = {{ HOSTNAMES.split(",")[0] }}
{% else %}
submission_host = {{ FRONT_ADDRESS }}
{% endif %}
{%- if SUBNET6 %}
listen = *,::
{% else %}
listen = *
{% endif %}

default_internal_user = dovecot
# Login processes handle untrusted client connections and must not use the
# shared mailbox account.
default_login_user = dovenull
default_internal_group = dovecot
{% if FULL_TEXT_SEARCH_ENABLED %}
import_environment {
  TZ = %{env:TZ}
  CORE_OUTOFMEM = %{env:CORE_OUTOFMEM}
  CORE_ERROR = %{env:CORE_ERROR}
  PATH = %{env:PATH}
  MALLOC_MMAP_THRESHOLD_ = 131072
  ICU_DATA = {{ ICU_DATA_PATH }}
}
{% endif %}

login_trusted_networks = {{ SUBNET }} {{ SUBNET6 }}

# Share mailbox attributes between IMAP METADATA and URLAUTH/BURL.
mail_attribute {
  dict file {
    path = %{home}/metadata/dovecot-attributes
  }
}
imap_urlauth_host = {{ HOSTNAMES.split(",")[0] }}
imap_capability {
  URLAUTH = yes
}

###############
# Mailboxes
###############
first_valid_gid = 100000
first_valid_uid = 100000
last_valid_gid = 2000000000
last_valid_uid = 2000000000
mail_driver = maildir
mail_path = ~/
# The admin-backed userdb returns a sharded per-mailbox home path.
valid_chroot_dirs = /mail
mail_path = ~/mail
mail_index_path = ~/indexes
maildir_very_dirty_syncs = yes
# Mail workers need the mail group to connect to Podop through the chroot.
# Mailbox directories stay mode 0700, so this does not grant cross-mailbox
# file access.
mail_access_groups = $SET:default_internal_group dovecot-proxy
maildir_stat_dirs = yes
mailbox_list_index = yes
protocol !indexer-worker {
  mail_vsize_bg_after_count = 100
}
default_vsz_limit = 2GB

mail_plugins {
  quota = yes
  quota_clone = yes
  {%- if COMPRESSION %}
  mail_compress = yes
  {%- endif %}
  {%- if FULL_TEXT_SEARCH_ENABLED %}
  fts = yes
  fts_flatcurve = yes
  {%- endif %}
}

namespace inbox {
  inbox = yes
  {% for mailbox in ("Trash", "Drafts", "Sent", "Junk") %}
  mailbox {{ mailbox }} {
    auto = subscribe
    special_use = \{{ mailbox }}
    {%- if mailbox in ("Junk", "Trash") %}
    autoexpunge = 90d
    {%- endif %}
    {%- if mailbox == "Junk" %}

    sieve_script report-spam {
      type = before
      driver = file
      path = /usr/share/mailu/sieve/report-spam.sieve
      cause = COPY APPEND DELIVERY
    }
    {%- endif %}
  }
  {% endfor %}
  # anything copied out of or delivered from Junk
  imapsieve_from Junk {
    sieve_script report-ham {
      type = before
      driver = file
      path = /usr/share/mailu/sieve/report-ham.sieve
      cause = COPY DELIVERY
    }
  }
}

quota User {
  driver = count
}
quota_clone {
  dict proxy {
    name = quota
    socket_path = /usr/run/podop/podop.socket
  }
}

{% if FULL_TEXT_SEARCH_ENABLED %}
fts flatcurve {
}
fts_search_timeout = 50s
fts_autoindex = yes
# do not fall back to a slow non-indexed search
fts_search_read_fallback = no
fts_header_excludes = Received DKIM-* ARC-* X-* x-* Comments Delivered-To Return-Path Authentication-Results Message-ID References In-Reply-To Thread-* Accept-Language Content-* MIME-Version
language_tokenizers = generic email-address
language_filters = normalizer-icu lowercase snowball stopwords
language_filter_stopwords_dir = /usr/share/dovecot/stopwords
{%- for lang in FULL_TEXT_SEARCH.split(",") %}
{%- set lang = lang | trim %}
language {{ lang }} {
  {%- if loop.first %}
  default = yes
  {%- endif %}
  {%- if lang == 'en' %}
  filters = normalizer-icu lowercase snowball english-possessive stopwords
  {%- endif %}
  {%- if lang == 'fr' %}
  filters = normalizer-icu lowercase snowball contractions stopwords
  {%- endif %}
}
{%- endfor %}
mailbox \Trash {
  fts_autoindex = no
}
mailbox \Junk {
  fts_autoindex = no
}
{%- if FULL_TEXT_SEARCH_ATTACHMENTS %}
fts_decoder_driver = tika
fts_decoder_tika_url = http://{{ FTS_ATTACHMENTS_ADDRESS }}:9998/tika/
{%- endif %}
{% endif %}

{% if COMPRESSION in [ 'gz', 'bz2', 'lz4', 'zstd' ] %}
mail_compress_write_method = {{ COMPRESSION }}
{%- if COMPRESSION_LEVEL %}
# One setting per method, and not every method has one: bz2 expresses the
# level as its block size and lz4 has none at all, so an unconditional
# compress_<method>_level would be an unknown setting for those two.
{%- if COMPRESSION == 'gz' %}
compress_gz_level = {{ COMPRESSION_LEVEL }}
{%- elif COMPRESSION == 'zstd' %}
compress_zstd_level = {{ COMPRESSION_LEVEL }}
{%- elif COMPRESSION == 'bz2' %}
compress_bz2_block_size_100k = {{ COMPRESSION_LEVEL }}
{%- endif %}
{%- endif %}
{%- endif %}

service indexer-worker {
  executable = /bin/nice -n 10 /usr/libexec/dovecot/indexer-worker
  # TODO: maybe MAXPROC? I guess it depends on how much RAM is available
  process_limit = 1
}

###############
# Authentication
###############
auth_username_chars =
auth_mechanisms {
  plain = yes
  login = yes
  xoauth2 = yes
  oauthbearer = yes
}
auth_allow_cleartext = yes

# use_worker defaults to no; leaving it out would move the lookup out of the
# auth-worker process into the auth process.
passdb lua {
  lua_file = /etc/dovecot/login.lua
  use_worker = yes
  mechanisms_filter = plain login
}

userdb lua {
  lua_file = /etc/dovecot/login.lua
  use_worker = yes
}

oauth2 {
  introspection_mode = post
  introspection_url = http://{{ ADMIN_ADDRESS }}:8080/internal/oauth2/introspect
  username_attribute = email
  issuers = {{ oauth2_issuers }}
  send_auth_headers = yes
  active_attribute = active
  active_value = true
}

service auth {
  # Lua auth uses the Admin API and does not need root privileges.
  user = $SET:default_internal_user
  process_limit = 1
  unix_listener auth-userdb {
  }
}

service auth-worker {
  user = $SET:default_internal_user
  unix_listener auth-worker {
  }
}

# Keep the normal DNS socket path for auth workers. Mail processes chrooted into
# /mail see the matching listener below as /run/dovecot/dns-client.
dns_client_socket_path = dns-client
service dns-client {
  unix_listener dns-client {
    path = dns-client
    group = dovecot
    mode = 0660
    type = dns-client
  }
  unix_listener dns-client-chroot {
    path = /mail/run/dovecot/dns-client
    group = dovecot-proxy
    mode = 0660
    type = dns-client
  }
}

# The userdb home path chroots mail workers into /mail. Give those workers a
# matching indexer socket path inside the jail for background vsize updates.
service indexer {
  unix_listener indexer-chroot {
    path = /mail/run/dovecot/indexer
    group = dovecot-proxy
    mode = 0660
    type = indexer
  }
  unix_listener /mail/usr/run/dovecot/indexer {
    group = dovecot-proxy
    mode = 0660
  }
}

# IMAP URLAUTH's worker socket is normally below /run/dovecot/token-login.
# Expose the same service socket under the mail-process chroot as well.
service imap-urlauth {
  unix_listener /mail/usr/run/dovecot/token-login/imap-urlauth {
    group = dovecot-proxy
    mode = 0660
  }
}

###############
# IMAP & POP
###############
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
  imap_metadata = yes
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 29mins
}

# Initialize the protected home on the first authenticated mail session.
# Delivery-first accounts are initialized by the global Sieve hook instead.
service mailbox-postlogin {
  executable = script-login /conf/bin/mailbox-postlogin
  user = root
  unix_listener mailbox-postlogin {
  }
}

service imap {
  executable = imap mailbox-postlogin
}
service pop3 {
  executable = pop3 mailbox-postlogin
}
service submission {
  executable = submission mailbox-postlogin
}

# Authenticated client submission is proxied here from front. Running the
# submission service beside mailbox storage lets it resolve BURL URLs locally.
service submission-login {
  inet_listener submission {
    port = 2587
  }
}

submission_relay_host = {{ SMTP_ADDRESS }}
submission_relay_port = 10025
submission_relay_trusted = yes
submission_relay_ssl = no

service imap-login {
  inet_listener imap {
    port = 143
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

###############
# Delivery
###############
recipient_delimiter = {{ RECIPIENT_DELIMITER }}
lda_original_recipient_header = X-Original-To
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  # Postfix already records the trusted remote hop in its Received header.
  # Avoid adding an internal LMTP trace header for every proxy/storage hop.
  lmtp_add_received_header = no
}

service lmtp {
  inet_listener lmtp {
    port = 2525
  }
}

###############
# Filtering
###############
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

protocol sieve {
  ssl = no
}

service managesieve {
  executable = managesieve mailbox-postlogin
  process_limit = 1024
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/sieve/.active
}
sieve_user_log_path = ~/sieve/.dovecot.sieve.log

# Dovecot looks up priv/sieve/name/<name> and priv/sieve/data/<id>, which is
# what the admin API serves.
sieve_script before-0 {
  type = before
  driver = dict
  name = default
  dict proxy {
    name = sieve
    socket_path = /usr/run/podop/podop.socket
  }
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

sieve_extensions {
  spamtest = yes
  spamtestplus = yes
  editheader = yes
}

sieve_global_extensions {
  vnd.dovecot.execute = yes
}

# Only global Sieve scripts can invoke the provisioner. It independently
# resolves the account through admin before creating any protected home.
service sieve-provision-mailbox {
  executable = script /app/venv/bin/python /provision_mailbox.py {{ ADMIN_ADDRESS }}
  user = root
  unix_listener /mail/run/dovecot/sieve-execute/provision-mailbox {
    group = dovecot-proxy
    mode = 0660
  }
}

# Sieve execute
sieve_execute_socket_dir = sieve-execute

service sieve-execute-spam {
  executable = script /conf/bin/spam
  user = dovenull
  unix_listener /mail/run/dovecot/sieve-execute/spam {
    group = dovecot-proxy
    mode = 0660
  }
}

service sieve-execute-ham {
  executable = script /conf/bin/ham
  user = dovenull
  unix_listener /mail/run/dovecot/sieve-execute/ham {
    group = dovecot-proxy
    mode = 0660
  }
}

# Send vacation replies even for aliases
# See the Pigeonhole documentation about warnings: http://wiki2.dovecot.org/Pigeonhole/Sieve/Extensions/Vacation
# It appears that our implementation of mail delivery meets criteria of section 4.5
# from RFC 5230 and that disabling the recipient checks is not an issue here.
sieve_vacation_check_recipient = no

# Include the recipient in vacation replies so that DKIM applies
sieve_vacation_send_from_recipient = yes

# Use To: header from original message becaus envelope has a SRS address
sieve_vacation_to_header_ignore_envelope = yes

# extract spam score from headers
sieve_spamtest_status_type = strlen
sieve_spamtest_status_header = X-Spam-Level
sieve_spamtest_score_max_value = 15

service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

###############
# Extensions
###############

!include_try /overrides/dovecot.conf
