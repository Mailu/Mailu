server:
  verbosity: 1
  interface: 0.0.0.0
{{- '  interface: ::0' if SUBNET6 }}
  logfile: ""
  do-ip4: yes
  do-ip6: {{ 'yes' if SUBNET6 else 'no' }}
  do-udp: yes
  do-tcp: yes
  # Use the host's default instead of requesting a larger socket buffer.
  so-sndbuf: 0
  do-daemonize: no
  access-control: {{ SUBNET }} allow
{%- if SUBNET6 %}
  access-control: {{ SUBNET6 }} allow
{%- endif %}
  directory: "/etc/unbound"
  username: unbound
  auto-trust-anchor-file: trusted-key.key
  root-hints: "/etc/unbound/root.hints"
  hide-identity: yes
  hide-version: yes
  cache-min-ttl: 300

