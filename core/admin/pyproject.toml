[project]
name = "mailu-admin"
version = "0.0.0"
description = "Mailu admin web interface"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "Babel==2.18.0",
    "bcrypt==4.3.0",
    "click==8.5.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "Flask==3.1.3",
    "Flask-Babel==4.0.0",
    "Flask-Bootstrap==3.3.7.1",
    "Flask-DebugToolbar==0.16.0",
    "Flask-Login==0.6.3",
    "flask-marshmallow==1.5.0",
    "Flask-Migrate==4.1.0",
    "Flask-RESTX==1.3.2",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "gunicorn[http2]==26.2.0",
    "h2==4.4.1",
    "hpack==4.2.0",
    "hyperframe==6.1.0",
    "idna==3.20",
    "itsdangerous==2.2.0",
    "limits==5.8.0",
    "marshmallow==4.3.1",
    "marshmallow-sqlalchemy==1.5.0",
    "mysql-connector-python==26.7.0",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.13",
    "Pygments==2.21.0",
    "python-gnupg==0.5.7",
    "PyYAML==6.0.3",
    "redis==8.1.0",
    "SQLAlchemy==2.0.54",
    "socrate==0.2.0",
    # passlib imports pkg_resources, which setuptools removed in version 82
    "setuptools==81.0.0",
    "srslib==0.1.5",
    "tabulate==0.10.0",
    "tenacity==9.1.4",
    "tld==0.13.2",
    "validators==0.35.0",
    "Werkzeug==3.1.8",
    "wonderwords==3.0.1",
    "WTForms==3.2.2",
    "WTForms-Components==0.11.0",
]

[project.optional-dependencies]
# Optional driver for MySQL/MariaDB via mysql+mariadb://; needs mariadb_config to build
mariadb = ["mariadb==1.1.14"]

[tool.uv]
package = false
