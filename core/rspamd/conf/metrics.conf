group "fuzzy" {
    max_score = 12.0;
    symbol "LOCAL_FUZZY_UNKNOWN" {
        weight = 5.0;
        description = "Generic fuzzy hash match";
    }
    symbol "LOCAL_FUZZY_DENIED" {
        weight = 12.0;
        description = "Denied fuzzy hash";
    }
    symbol "LOCAL_FUZZY_PROB" {
        weight = 5.0;
        description = "Probable fuzzy hash";
    }
    symbol "LOCAL_FUZZY_WHITE" {
        weight = -2.1;
        description = "Whitelisted fuzzy hash";
    }
}
group "reputation" {
    symbol "SENDER_REP_HAM" {
        weight = -1.0;
    }
    symbol "SENDER_REP_SPAM" {
        weight = 4.0;
    }
    symbol "DKIM_REPUTATION" {
        weight = 1.0;
    }
    symbol "SPF_REPUTATION_HAM" {
        weight = -1.0;
    }
    symbol "SPF_REPUTATION_SPAM" {
        weight = 2.0;
    }
}
.include(try=true,priority=1,duplicate=merge) "/overrides/metrics.conf"
