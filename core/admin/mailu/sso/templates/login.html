{%- extends "form_sso.html" %}

{%- block title %}
{% trans %}Sign in{% endtrans %}
{%- endblock %}

{%- block extra_login_options %}
<span class="text-body-secondary small mx-1">{% trans %}or{% endtrans %}</span>
{% if config["ADMIN"]|upper != "FALSE" %}
<button class="passkey-login btn btn-outline-primary" data-destination="admin" type="button">
    <i class="fa-solid fa-key me-1" aria-hidden="true"></i>{% trans %}Sign in to Admin with a passkey{% endtrans %}
</button>
{% endif %}
{% if config["WEBMAIL"]|upper != "NONE" %}
<button class="passkey-login btn btn-outline-primary" data-destination="webmail" type="button">
    <i class="fa-solid fa-key me-1" aria-hidden="true"></i>{% trans %}Sign in to Webmail with a passkey{% endtrans %}
</button>
{% endif %}
<div id="passkey-status" class="alert text-start mt-3 mb-0 w-100 d-none" role="status" aria-live="polite"></div>
<script>
(() => {
  const buttons = [...document.querySelectorAll('.passkey-login')];
  const status = document.getElementById('passkey-status');
  const emailField = document.getElementById('email');
  const form = document.querySelector('form.form');
  const submitButtons = [...form.querySelectorAll('button[type="submit"], input[type="submit"]')];
  const originalLabels = new Map(buttons.map(button => [button, button.innerHTML]));
  const supported = Boolean(window.PublicKeyCredential && navigator.credentials && navigator.credentials.get);
  let attemptId = 0;
  let activeAttempt = null;
  let conditionalController = null;

  if (!supported) buttons.forEach(button => { button.hidden = true; });

  const decode = value => {
    const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(base64 + '='.repeat((4 - base64.length % 4) % 4)), c => c.charCodeAt(0));
  };
  const encode = value => btoa(String.fromCharCode(...new Uint8Array(value)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const serialize = credential => ({
    id: credential.id,
    rawId: encode(credential.rawId),
    type: credential.type,
    response: {
      authenticatorData: encode(credential.response.authenticatorData),
      clientDataJSON: encode(credential.response.clientDataJSON),
      signature: encode(credential.response.signature),
      userHandle: credential.response.userHandle ? encode(credential.response.userHandle) : null
    }
  });
  const responseJson = async (response, action) => {
    let data;
    try {
      data = await response.json();
    } catch (_) {
      throw new Error(`${action} failed: the server returned HTTP ${response.status}, not a JSON response. If this continues, contact your administrator.`);
    }
    if (!response.ok) throw new Error(data.error || `${action} failed (HTTP ${response.status}).`);
    return data;
  };
  const showStatus = (message, type='danger') => {
    status.textContent = message;
    status.classList.remove('d-none', 'alert-danger', 'alert-info');
    status.classList.add(`alert-${type}`);
  };

  const clearStatus = () => {
    status.textContent = '';
    status.classList.add('d-none');
    status.classList.remove('alert-danger', 'alert-info');
  };

  const setBusy = (busy, activeButton=null) => {
    buttons.forEach(button => {
      button.disabled = busy;
      button.setAttribute('aria-busy', String(busy));
      button.innerHTML = busy && button === activeButton
        ? '{% trans %}Waiting for passkey...{% endtrans %}'
        : originalLabels.get(button);
    });
    submitButtons.forEach(control => { control.disabled = busy; });
  };

  const cancelAttempt = () => {
    attemptId++;
    if (activeAttempt) activeAttempt.controller.abort();
    activeAttempt = null;
    if (conditionalController) conditionalController.abort();
    conditionalController = null;
    setBusy(false);
  };

  const verifyCredential = async (credential, signal) => {
    const verifyResponse = await fetch('{{ url_for("sso.passkey_authenticate") }}', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(serialize(credential)), signal
    });
    const result = await responseJson(verifyResponse, 'Passkey sign-in failed');
    window.location.assign(result.redirect);
  };

  const beginPasskeyLogin = async (button) => {
    if (!supported) {
      showStatus('This browser does not support passkey sign-in. Use your email and password instead.');
      return;
    }
    cancelAttempt();
    clearStatus();
    const id = ++attemptId;
    const controller = new AbortController();
    activeAttempt = {id, controller, button};
    try {
      const startResponse = await fetch('{{ url_for("sso.passkey_authentication_options") }}', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: emailField.value.trim(), target: button.dataset.destination}), signal: controller.signal
      });
      const options = await responseJson(startResponse, 'Could not start passkey sign-in');
      const allowed = options.allowCredentials || [];
      if (emailField.value.trim() && !allowed.length) {
        showStatus('No passkey is registered for this email address. Clear the email field to choose a passkey, or sign in with your password.', 'info');
        return;
      }
      options.challenge = decode(options.challenge);
      if (options.allowCredentials) {
        options.allowCredentials = options.allowCredentials.map(item => ({...item, id: decode(item.id)}));
      }
      setBusy(true, button);
      const credential = await navigator.credentials.get({publicKey: options, signal: controller.signal});
      if (!credential) throw new Error('No passkey was selected. Try again or sign in with your password.');
      await verifyCredential(credential, controller.signal);
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name === 'NotAllowedError') {
        showStatus('No passkey was selected, it was unavailable, or the request timed out. Try again, or sign in with your email and password.');
      } else if (e.name === 'SecurityError') {
        showStatus('Passkey sign-in is blocked for this site. Check that you are using the configured Mailu hostname over HTTPS.');
      } else if (e.name === 'NotSupportedError') {
        showStatus('This browser or device does not support passkey sign-in. Use a supported browser or sign in with your password.');
      } else {
        showStatus(e.message || 'Passkey sign-in failed. Try again or use your password.');
      }
    } finally {
      if (activeAttempt && activeAttempt.id === id) {
        activeAttempt = null;
        setBusy(false);
      }
    }
  };

  const beginConditionalLogin = async () => {
    if (!supported || !buttons.length || !PublicKeyCredential.isConditionalMediationAvailable) return;
    const controller = new AbortController();
    conditionalController = controller;
    try {
      if (!await PublicKeyCredential.isConditionalMediationAvailable()) return;
      const target = buttons[0].dataset.destination;
      const startResponse = await fetch('{{ url_for("sso.passkey_authentication_options") }}', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: '', target}), signal: controller.signal
      });
      const options = await responseJson(startResponse, 'Could not start passkey sign-in');
      options.challenge = decode(options.challenge);
      if (options.allowCredentials) {
        options.allowCredentials = options.allowCredentials.map(item => ({...item, id: decode(item.id)}));
      }
      const credential = await navigator.credentials.get({
        publicKey: options, mediation: 'conditional', signal: controller.signal
      });
      if (credential) await verifyCredential(credential, controller.signal);
    } catch (e) {
      if (e.name !== 'AbortError') showStatus(e.message || 'Passkey sign-in failed. Try again or use your password.');
    } finally {
      if (conditionalController === controller) conditionalController = null;
    }
  };

  form.addEventListener('submit', cancelAttempt, true);
  buttons.forEach(button => button.addEventListener('click', () => beginPasskeyLogin(button)));
  beginConditionalLogin();
})();
</script>
{%- endblock %}
