[project]
name = "mailu"
version = "0.0.0"
description = "Mailu mail server services"
requires-python = ">=3.14"
dependencies = [
    "mailu-admin",
    "oletools",
    "podop",
    "postfix-mta-sts-resolver",
    "python-magic",
    "radicale",
    "requests",
    "socrate",
    "uvloop",
    "watchdog",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core/base/libs/*", "core/admin"]

[tool.uv.sources]
mailu-admin = { workspace = true }
podop = { workspace = true }
socrate = { workspace = true }

[tool.towncrier]
    package = "towncrier"
    filename = "CHANGELOG.md"
    underlines = ["-", "", ""]
    template = "towncrier/template.md"
    title_format = "v{version} - {project_date}"
    issue_format = "[#{issue}](https://github.com/Mailu/Mailu/issues/{issue})"
    start_string = "<!-- TOWNCRIER -->"

[dependency-groups]
dev = [
    "colorama==0.4.6",
    "docker==7.2.0",
    "managesieve==0.8.1",
    "pytest>=9.1.1",
]
docs = [
    "docutils~=0.22.4",
    "recommonmark~=0.7.1",
    "Sphinx~=9.1.0",
    "sphinx-autobuild~=2025.8.25",
    "sphinx_rtd_theme~=3.1.0",
]
