rules {
  ip_reputation {
    selector "ip" {
    }
    backend "redis" {
      servers = "{{ REDIS_ADDRESS }}";
      expiry = 90d;
    }
    symbol = "SENDER_REP";
  }
  dkim_reputation {
    selector "dkim" {
    }
    backend "redis" {
      servers = "{{ REDIS_ADDRESS }}";
      expiry = 90d;
    }
    symbol = "DKIM_REPUTATION";
  }
  spf_reputation {
    selector "spf" {
    }
    backend "redis" {
      servers = "{{ REDIS_ADDRESS }}";
      expiry = 90d;
    }
    symbol = "SPF_REPUTATION";
  }
}
